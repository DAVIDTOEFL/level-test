const FILLERS = /\b(um+|uh+|er+|hmm+|you know|kind of|sort of)\b/gi;

function scoreInterview(r, qIdx) {
  const w = words(r.text), n = w.length, flags = [];

  const uniq = new Set(norm(r.text)).size / Math.max(1, norm(r.text).length);
  let score = n < 8 ? 1 : n < 25 * scale ? 2 : n < 55 * scale ? 3 : n < 80 * scale ? 4 : 5;
  if (n === 0) score = 0;

  if (fillers / Math.max(1, n) > 0.1) { score = Math.max(0, score - 1); flags.push({ cat: "Interview · 필러/휴지", msg: `필러(um, uh 등) ${fillers}회로 전달 흐름이 끊깁니다.`, rubric: "3점대: 잦은 휴지와 필러로 흐름이 끊김" }); }
  if (n >= 25 && uniq < 0.55) { score = Math.min(score, 3); flags.push({ cat: "Interview · 어휘 범위", msg: "같은 단어 반복이 많아 어휘·문법 범위가 제한적으로 보입니다.", rubric: "3점대: 문법·어휘의 범위와 정확성이 제한적" }); }

const MISSPELL = { recieve: "receive", sucessfully: "successfully", successfuly: "successfully", engageing: "engaging", comunity: "community", definately: "definitely", seperate: "separate", teh: "the", alot: "a lot", untill: "until", wich: "which", occured: "occurred", beleive: "believe", goverment: "government", enviroment: "environment", necesary: "necessary", accomodate: "accommodate", tommorow: "tomorrow", tomorow: "tomorrow", thier: "their", becuase: "because", wierd: "weird", submision: "submission", submited: "submitted", poem: "poem", magzine: "magazine", magazin: "magazine", responce: "response", writting: "writing", experiance: "experience", intrested: "interested", importent: "important", studens: "students", volenteer: "volunteer", volunteerism: "volunteerism" };
function mechanics(text) {

  return issues;
}
const SUBORD = /\b(although|because|which|while|since|that|if|when|whereas|even though|so that|who|whose|unless)\b/gi;

function scoreEmail(text) {

/* ============ AUDIO / MIC HELPERS ============ */
const hasTTS = typeof window !== "undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
let _voices = null;
function loadVoices() { if (!hasTTS) return []; try { const vs = window.speechSynthesis.getVoices().filter((v) => /^en/i.test(v.lang)); if (vs.length) _voices = vs; } catch (e) {} return _voices || []; }
if (hasTTS) { try { window.speechSynthesis.onvoiceschanged = () => loadVoices(); } catch (e) {} }
const MALE_RE = /david|daniel|alex\b|fred|mark|george|guy|ryan|james|thomas|oliver|aaron|arthur|rishi|\bmale\b/i;
const FEMALE_RE = /female|zira|samantha|karen|moira|tessa|susan|victoria|allison|ava|serena|fiona|jenny|aria|libby|sonia|google us english/i;
function voiceFor(who) {
  const vs = loadVoices(); if (!vs.length) return { voice: null, matched: false };
  const male = vs.find((v) => /\bmale\b/i.test(v.name) && !/female/i.test(v.name)) || vs.find((v) => MALE_RE.test(v.name) && !/female/i.test(v.name));
  const female = vs.find((v) => FEMALE_RE.test(v.name));
  if (who === "M") { if (male) return { voice: male, matched: true }; const o = vs.find((v) => v !== female); return { voice: o || null, matched: false }; }
  if (female) return { voice: female, matched: true }; const o = vs.find((v) => v !== male); return { voice: o || null, matched: false };
}
function speak(text, { who = "W", rate = 0.95 } = {}) {
  return new Promise((resolve) => {
    if (!hasTTS) return resolve();
    let done = false; const fin = () => { if (!done) { done = true; resolve(); } };
    try {
      const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = rate;
      const { voice, matched } = voiceFor(who);
      if (voice) u.voice = voice;
      u.pitch = matched ? 1 : (who === "M" ? 0.6 : 1.3);
      u.onend = fin; u.onerror = fin;
      window.speechSynthesis.speak(u);

    } catch (e) { fin(); }
  });
}
const stopSpeech = () => { try { if (hasTTS) window.speechSynthesis.cancel(); } catch (e) {} };
const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
const SR = typeof window !== "undefined" ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;

/* 음성 인식은 Speaking 구간 동안 세션 1개만 유지해 문항마다 권한 확인이 반복되지 않도록 한다 */
const SRS = { rec: null, active: false, done: [], cur: [], blocked: false };
const srsAll = () => SRS.done.concat(SRS.cur);
const srsMark = () => srsAll().length;
const srsSince = (b) => srsAll().slice(b).join(" ").trim();
const SR_OFF = { v: false };
function srsStart() {
  if (!SR || SRS.active || SR_OFF.v || SRS.blocked) return;
  SRS.active = true; SRS.done = []; SRS.cur = []; let restarts = 0, quick = 0, born = Date.now();
  const r = new SR(); r.lang = "en-US"; r.continuous = true; r.interimResults = true;
  r.onstart = () => { born = Date.now(); };
  r.onresult = (ev) => { SRS.cur = []; for (let i = 0; i < ev.results.length; i++) SRS.cur.push(ev.results[i][0].transcript.trim()); };
  r.onend = () => {
    SRS.done = SRS.done.concat(SRS.cur); SRS.cur = [];
    if (Date.now() - born < 1500) quick++; else quick = 0;
    /* 권한 오류·반복 즉시 종료 시 재시작을 멈춰 허용 팝업이 다시 뜨지 않게 한다 */
    if (SRS.active && !SRS.blocked && quick < 3 && restarts++ < 200) setTimeout(() => { if (SRS.active && !SRS.blocked) { try { r.start(); } catch (e) { SRS.active = false; } } }, 250);
    else SRS.active = false;

  r.onerror = (e) => { if (e && (e.error === "not-allowed" || e.error === "service-not-allowed")) { SRS.blocked = true; SRS.active = false; } };

}

const MicContext = createContext({ status: "unknown", stream: null });

function useCountdown(total, onEnd) {
  const [left, setLeft] = useState(total);
  const endRef = useRef(onEnd); endRef.current = onEnd;
  useEffect(() => {
    const end = Date.now() + total * 1000; let fired = false;
    const id = setInterval(() => {
      const l = Math.max(0, Math.ceil((end - Date.now()) / 1000)); setLeft(l);
      if (l <= 0 && !fired) { fired = true; clearInterval(id); endRef.current(); }
    }, 250);
    return () => clearInterval(id);
  }, [total]);
  return left;
}

function LevelMeter({ stream, active, onVoiced }) {
  const [lv, setLv] = useState(0);
  useEffect(() => {
    if (!stream || !active) { setLv(0); return; }
    let raf, ctx, last = performance.now();
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream), an = ctx.createAnalyser(); an.fftSize = 512; src.connect(an);
      const buf = new Uint8Array(an.fftSize);
      const loop = () => {
        an.getByteTimeDomainData(buf); let sum = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
        const rms = Math.sqrt(sum / buf.length), now = performance.now(), dt = now - last; last = now;
        setLv(Math.min(1, rms * 5)); if (rms > 0.02 && onVoiced) onVoiced(dt);
        raf = requestAnimationFrame(loop);
      }; loop();
    } catch (e) {}
    return () => { cancelAnimationFrame(raf); try { ctx && ctx.close(); } catch (e) {} };
  }, [stream, active]);
  const bars = 14;
  return (
    <div className="flex items-end gap-[3px] h-8" aria-label="마이크 입력 레벨">
      {Array.from({ length: bars }).map((_, i) => (
        <div key={i} style={{ width: 5, height: `${Math.max(12, Math.min(100, (lv * 140) * (0.5 + 0.5 * Math.sin(i * 1.3 + 1))))}%`, background: lv > 0.04 ? "var(--accent)" : "var(--line)", borderRadius: 3, transition: "height .08s" }} />
      ))}
    </div>
  );
}

const Card = ({ children, className = "" }) => <section className={"bg-surface border border-line rounded-lg p-5 " + className}>{children}</section>;
const Tag = ({ children, tone = "muted" }) => <span className="text-[11px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded" style={{ background: tone === "accent" ? "var(--accent)" : "var(--surface2)", color: tone === "accent" ? "var(--accentInk)" : "var(--muted)" }}>{children}</span>;

function MCQ({ q, idx, value, onChange }) {
  return (
    <div className="mb-6" role="radiogroup" aria-label={q.q}>
      <p className="font-semibold mb-2">{idx}. {q.q}</p>
      <div className="flex flex-col gap-2">
        {q.o.map((o, i) => (
          <button key={i} type="button" role="radio" aria-checked={value === i} className="opt" onClick={() => onChange(i)}>
            <span className="dot" /><span><span className="mono text-muted mr-2">{"ABCD"[i]}</span>{o}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ============ READING ============ */
function Reading({ onDone }) {
  const [u, setU] = useState(0);
  const [ans, setAns] = useState({});
  const ansRef = useRef(ans); ansRef.current = ans;
  useLive(() => compileMCQ(READING_UNITS, ansRef.current, "reading"));
  const finish = useCallback(() => onDone(compileMCQ(READING_UNITS, ansRef.current, "reading")), [onDone]);
  const left = useCountdown(READING_SECONDS, finish);
  const unit = READING_UNITS[u];
  const set = (k, v) => setAns((a) => ({ ...a, [k]: v }));
  return (
    <Shell section="reading" title={`${unit.title} · ${unit.src}`} step={u + 1} total={READING_UNITS.length} timeLabel="Section" timeLeft={left} warnAt={30}
      footer={<><span className="text-sm text-muted">Reading 샘플 문항 · 영역 제한시간 {READING_SECONDS / 60}분</span>
        <button className="btn" onClick={() => (u + 1 < READING_UNITS.length ? setU(u + 1) : finish())}>{u + 1 < READING_UNITS.length ? "Next →" : "Reading 제출 · Listening으로"}</button></>}>
      <div className="mb-3 flex items-center gap-2"><Tag tone="accent">{unit.title}</Tag><span className="text-muted text-sm">{unit.instr}</span></div>
      {unit.kind === "ctw" ? (
        <Card><p className="passage">
          {unit.parts.map((p, i) => typeof p === "string" ? <span key={i}>{p}</span> :
            <input key={i} id={`ctw-${i}`} type="text" className="blank" style={{ width: `${p.b.length * 0.85 + 1}em` }} placeholder={"_".repeat(p.b.length)} maxLength={p.b.length} autoComplete="off" spellCheck="false" aria-label={`빈칸 ${p.b.length}글자`} value={ans["ctw" + i] || ""} onChange={(e) => set("ctw" + i, e.target.value)} />)}
        </p><p className="text-sm text-muted mt-4">단어의 뒷부분이 비어 있습니다. 밑줄(_) 하나가 빠진 글자 1개이므로, 밑줄 개수만큼 알파벳을 입력하세요. (10곳)</p></Card>
      ) : (
        <div className="grid md:grid-cols-2 gap-4">
          <Card className="min-w-0"><p className="passage whitespace-pre-line">{unit.passage}</p></Card>
          <Card className="min-w-0">{unit.qs.map((q, i) => <MCQ key={i} q={q} idx={i + 1} value={ans[unit.id + i]} onChange={(v) => set(unit.id + i, v)} />)}</Card>
        </div>
      )}
    </Shell>
  );
}

function compileMCQ(units, ans, sec) {
  const items = [];
  units.forEach((un) => {
    if (un.kind === "ctw") un.parts.forEach((p, i) => { if (typeof p !== "string") items.push({ unit: un.title, skill: "Word form / spelling", ok: (ans["ctw" + i] || "").trim().toLowerCase() === p.b, answered: !!(ans["ctw" + i] || "").trim(), q: "빈칸 " + p.b.length + "글자 (" + p.b + ")" }); });
    else un.qs.forEach((q, i) => items.push({ unit: un.title, skill: q.skill, ok: ans[un.id + i] === q.a, answered: ans[un.id + i] !== undefined, q: q.q, picked: ans[un.id + i], correct: q.a, opts: q.o, scriptUsed: ans["script_" + un.id] }));
  });
  const right = items.filter((x) => x.ok).length;
  return { items, right, total: items.length, ratio: right / items.length };
}

/* ============ LISTENING ============ */
function AudioUnit({ unit, onPlayed, scriptShown, onShowScript }) {
  const [state, setState] = useState("idle");
  const [who, setWho] = useState(null);
  const cancel = useRef(false);
  useEffect(() => () => { cancel.current = true; stopSpeech(); }, []);
  const names = { W: "Woman", M: "Man" };
  const speakers = [...new Set(unit.lines.map((l) => l.who))];
  const play = async () => {
    setState("playing"); cancel.current = false;
    for (const l of unit.lines) { if (cancel.current) return; setWho(l.who); await speak(l.t, { who: l.who }); await new Promise((r) => setTimeout(r, 350)); }
    setWho(null); setState("done"); onPlayed();
  };
  return (
    <Card>
      <div className="flex items-center gap-4 flex-wrap">
        <button className="btn" disabled={state !== "idle"} onClick={play}>{state === "idle" ? "▶ 재생 (1회만)" : state === "playing" ? "재생 중…" : "재생 완료"}</button>
        <div className="flex items-end gap-1 h-8" aria-hidden="true">
          {Array.from({ length: 16 }).map((_, i) => <div key={i} className="wavebar" style={{ animationDelay: `${(i % 8) * 0.1}s`, animationPlayState: state === "playing" ? "running" : "paused", height: state === "playing" ? undefined : "15%", opacity: state === "playing" ? 1 : 0.35 }} />)}
        </div>
        {speakers.length > 1 && <div className="flex gap-2">{speakers.map((s) => <span key={s} className="text-xs font-semibold px-2.5 py-1 rounded border" style={{ borderColor: who === s ? "var(--accent)" : "var(--line)", background: who === s ? "var(--accent)" : "var(--surface2)", color: who === s ? "var(--accentInk)" : "var(--muted)" }}>{names[s]}</span>)}</div>}
        {!hasTTS && <span className="text-sm text-warn">이 브라우저는 음성 합성을 지원하지 않습니다. 아래 스크립트로 진행하세요.</span>}
      </div>
      <div className="mt-3 text-sm">
        {(scriptShown || !hasTTS) ? <div className="bg-surface2 border border-line rounded p-3 whitespace-pre-line passage">{unit.lines.map((l) => (speakers.length > 1 ? names[l.who] + ": " : "") + l.t).join("\n")}</div>
          : <button className="underline text-muted" onClick={onShowScript}>소리가 나지 않나요? 스크립트 보기 (채점 신뢰도 표시됨)</button>}
      </div>
    </Card>
  );
}

function Listening({ onDone }) {
  const [u, setU] = useState(0);
  const [ans, setAns] = useState({});
  const [played, setPlayed] = useState({});
  const ansRef = useRef(ans); ansRef.current = ans;
  useLive(() => compileMCQ(LISTENING_UNITS, ansRef.current, "listening"));
  const finish = useCallback(() => { stopSpeech(); onDone(compileMCQ(LISTENING_UNITS, ansRef.current, "listening")); }, [onDone]);
  const left = useCountdown(LISTENING_SECONDS, finish);
  const unit = LISTENING_UNITS[u];
  const set = (k, v) => setAns((a) => ({ ...a, [k]: v }));
  const unplayed = !played[unit.id] && hasTTS && !ans["script_" + unit.id];
  return (
    <Shell section="listening" title={`${unit.title} · ${unit.src}`} step={u + 1} total={LISTENING_UNITS.length} timeLabel="Section" timeLeft={left} warnAt={30}
      footer={<><span className="text-sm text-muted">{unplayed ? "먼저 오디오를 재생하세요." : "문항에 답한 뒤 다음으로 이동합니다."}</span>
        <button className="btn" onClick={() => { stopSpeech(); u + 1 < LISTENING_UNITS.length ? setU(u + 1) : finish(); }}>{u + 1 < LISTENING_UNITS.length ? "Next →" : "Listening 제출 · Writing으로"}</button></>}>
      <div className="mb-3 flex items-center gap-2"><Tag tone="accent">{unit.title}</Tag><span className="text-muted text-sm">{unit.instr}</span></div>
      <div className="flex flex-col gap-4" key={unit.id}>
        <AudioUnit unit={unit} scriptShown={!!ans["script_" + unit.id]} onShowScript={() => set("script_" + unit.id, true)} onPlayed={() => setPlayed((p) => ({ ...p, [unit.id]: true }))} />
        <Card>{unit.qs.map((q, i) => <MCQ key={i} q={q} idx={i + 1} value={ans[unit.id + i]} onChange={(v) => set(unit.id + i, v)} />)}</Card>
      </div>
    </Shell>
  );
}

/* ============ WRITING ============ */

  const [text, setText] = useState("");
  const textRef = useRef(""); textRef.current = text;
  if (liveRef) liveRef.current = () => textRef.current;
  const doneRef = useRef(false);
  const finish = useCallback(() => { if (doneRef.current) return; doneRef.current = true; onDone(textRef.current); }, [onDone]);
  const total = isEmail ? EMAIL_SECONDS : DISCUSSION_SECONDS;

      footer={<><span className="text-sm mono" style={{ color: !isEmail && n < minW ? "var(--warn)" : "var(--good)" }}>{n} words · {text.length} chars{!isEmail && (n >= minW ? " · 100단어 이상 ✓" : ` · ${minW - n}단어 더 필요`)}</span>
        <button className="btn" onClick={finish}>{isEmail ? "Email 제출 → 다음 Task" : "Writing 제출 · Speaking으로"}</button></>}>

        <div className="flex flex-col gap-3 min-w-0">
          {isEmail ? (
            <Card>
              <div className="flex items-center gap-2 mb-2"><Tag tone="accent">Write an Email</Tag><span className="text-sm text-muted">You will read some information and use it to write an email.</span></div>
              <p className="passage mb-3">{EMAIL.scenario}</p>
              <p className="font-semibold mb-1">Write an email to {EMAIL.recipient}. In your email, do the following.</p>

              <Card>

              </Card>
              <Card className="space-y-3 text-[14.5px] leading-relaxed">
                <div><div className="font-semibold">Professor</div>{DISCUSSION.prof}</div>
                <div className="border-t border-line pt-3"><div className="font-semibold">{DISCUSSION.s1[0]}</div>{DISCUSSION.s1[1]}</div>
                <div className="border-t border-line pt-3"><div className="font-semibold">{DISCUSSION.s2[0]}</div>{DISCUSSION.s2[1]}</div>
              </Card>

          )}

        <Card className="min-w-0 flex flex-col gap-2">
          <div className="font-semibold">Your Response</div>

          <textarea id={"write-" + kind} className="w-full p-3 passage" style={{ minHeight: 320, resize: "vertical" }} value={text} onChange={(e) => setText(e.target.value)} placeholder="Type your response here…" spellCheck="false" autoFocus />
          <div className="flex justify-between text-sm mono text-muted"><span>{n} words</span>{!isEmail && <span>min 100</span>}</div>
          {!isEmail && <div className="h-2 rounded bg-surface2 border border-line overflow-hidden"><div className="h-full" style={{ width: Math.min(100, n) + "%", background: n >= 100 ? "var(--good)" : "var(--warn)", transition: "width .2s" }} /></div>}
        </Card>
      </div>

}

function Writing({ onDone }) {
  const [stage, setStage] = useState(0); const [res, setRes] = useState({});
  const liveRef = useRef(() => "");
  useLive(() => ({ email: stage === 0 ? liveRef.current() : (res.email || ""), disc: stage === 1 ? liveRef.current() : "" }));
  if (stage === 0) return <WriteTask key="e" kind="email" stepOffset={1} liveRef={liveRef} onDone={(t) => { setRes({ email: t }); setStage(1); }} />;
  return <WriteTask key="d" kind="disc" stepOffset={2} liveRef={liveRef} onDone={(t) => onDone({ ...res, disc: t })} />;
}

/* ============ SPEAKING ============ */
function ResponsePanel({ seconds, label, placeholder, onFinish, onTick }) {
  const mic = useContext(MicContext);
  const [text, setText] = useState(""); const textRef = useRef(""); textRef.current = text;
  const [recording, setRecording] = useState(false);
  const [, force] = useState(0);
  const voiced = useRef(0), doneRef = useRef(false), recRef = useRef(null), edited = useRef(false), base = useRef(srsMark());
  const useMic = mic.status === "ready" && mic.stream;
  useEffect(() => {
    SPK_CUR.get = () => { let t = textRef.current; if (!edited.current && SRS.active) t = srsSince(base.current); return { text: t, voicedMs: voiced.current, usedMic: !!useMic, usedSR: !!(useMic && SRS.active) }; };
    return () => { SPK_CUR.get = null; };
  }, [useMic]);
  useEffect(() => {
    if (!useMic) return;
    setRecording(true);
    try { recRef.current = new MediaRecorder(mic.stream); recRef.current.start(); } catch (e) {}
    const id = setInterval(() => { if (!edited.current && SRS.active) { const t = srsSince(base.current); if (t !== textRef.current) setText(t); } }, 300);
    return () => { clearInterval(id); try { recRef.current && recRef.current.state !== "inactive" && recRef.current.stop(); } catch (e) {} };
  }, [useMic]);
  const finish = useCallback(() => {
    if (doneRef.current) return; doneRef.current = true; setRecording(false);
    let t = textRef.current; if (!edited.current && SRS.active) t = srsSince(base.current);
    try { recRef.current && recRef.current.state !== "inactive" && recRef.current.stop(); } catch (e) {}
    onFinish({ text: t, voicedMs: voiced.current, usedMic: !!useMic, usedSR: !!(useMic && SRS.active) });
  }, [onFinish, useMic]);
  const left = useCountdown(seconds, finish);
  const pct = ((seconds - left) / seconds) * 100;
  useEffect(() => { if (onTick) onTick(left); }, [left]);
  return (
    <Card className="flex flex-col gap-3">
      <div className="flex items-center gap-3 flex-wrap">
        <span className="flex items-center gap-2 font-semibold" style={{ color: recording ? "var(--bad)" : "var(--muted)" }}>
          <span className={recording ? "rec" : ""} style={{ width: 12, height: 12, borderRadius: "50%", background: recording ? "var(--bad)" : "var(--muted)", display: "inline-block" }} />
          {recording ? "REC · 녹음 중" : "텍스트 응답 모드"}
        </span>
        <LevelMeter stream={useMic ? mic.stream : null} active={recording} onVoiced={(dt) => { voiced.current += dt; }} />
        <span className="ml-auto mono text-2xl font-semibold" style={{ color: left <= 5 ? "var(--bad)" : "var(--ink)" }}>{fmt(left)}</span>
      </div>
      <div className="h-2 rounded bg-surface2 border border-line overflow-hidden"><div className="h-full" style={{ width: pct + "%", background: left <= 5 ? "var(--bad)" : "var(--accent)", transition: "width .25s linear" }} /></div>
      <label htmlFor="spk-text" className="text-sm text-muted">{useMic ? (SR && SRS.active ? "실시간 전사(수정 가능)" : "이 브라우저는 자동 전사를 지원하지 않아 채점용으로 답변 내용을 직접 입력해 주세요.") : label}</label>
      <textarea id="spk-text" className="w-full p-3" style={{ minHeight: 110, resize: "vertical" }} value={text} onChange={(e) => { edited.current = true; setText(e.target.value); }} placeholder={placeholder} spellCheck="false" autoFocus />
      <div className="flex justify-between items-center"><span className="text-sm text-muted mono">{words(text).length} words{useMic && SR && SRS.active && <button className="underline ml-3 font-sans" onClick={() => { SR_OFF.v = true; srsStop(); force((n) => n + 1); }}>자동 전사 끄기</button>}</span><button className="btn" onClick={finish}>답변 완료 →</button></div>
    </Card>
  );
}

function Speaking({ onDone }) {
  const mic = useContext(MicContext);
  const total = LR.lines.length + INTERVIEW.qs.length;
  const [i, setI] = useState(0);
  const [phase, setPhase] = useState("listen");
  const [scriptShown, setScriptShown] = useState(false);
  const [tl, setTl] = useState(null);
  const results = useRef({ lr: [], iv: [] });
  const isLR = i < LR.lines.length;
  const qi = i - LR.lines.length;
  const iRef = useRef(0); iRef.current = i;
  useLive(() => {
    const out = { lr: results.current.lr.slice(), iv: results.current.iv.slice() };
    const cur = SPK_CUR.get && SPK_CUR.get(), ii = iRef.current;
    if (cur && (cur.text || "").trim()) { if (ii < LR.lines.length) { if (out.lr.length === ii) out.lr.push({ ...cur }); } else if (out.iv.length === ii - LR.lines.length) out.iv.push({ ...cur }); }
    return out;
  });
  useEffect(() => { if (mic.status === "unknown") mic.requestMic(); }, []);
  useEffect(() => { if (mic.status === "ready") srsStart(); }, [mic.status]);
  useEffect(() => () => srsStop(), []);
  const next = (r) => {
    (isLR ? results.current.lr : results.current.iv).push({ ...r, scriptShown });
    if (i + 1 >= total) { stopSpeech(); srsStop(); onDone(results.current); return; }
    setI(i + 1); setPhase("listen"); setScriptShown(false); setTl(null);
  };
  useEffect(() => {
    let cancelled = false; setPhase("listen");
    (async () => {
      await new Promise((r) => setTimeout(r, 500));
      await speak(isLR ? LR.lines[i] : INTERVIEW.qs[qi], { who: isLR ? "W" : "M" });
      await new Promise((r) => setTimeout(r, 700));
      if (!cancelled) setPhase(!isLR && !hasTTS ? "ready" : "respond");
    })();
    return () => { cancelled = true; stopSpeech(); };
  }, [i]);
  const title = isLR ? `Listen and Repeat · ${i + 1}/7` : `Take an Interview · Question ${qi + 1}/4`;
  return (
    <Shell section="speaking" title={title} step={i + 1} total={total} timeLabel={isLR ? "Speak" : "Answer"} timeLeft={tl} warnAt={5}>
      <div className="mb-3 flex items-center gap-2 flex-wrap"><Tag tone="accent">{isLR ? "Listen and Repeat" : "Take an Interview"}</Tag>
        <span className="text-sm text-muted">{isLR ? "No preparation time. 들은 문장을 한 번만 그대로 따라 말하세요." : "준비시간 없음. 질문이 모두 끝난 직후 45초 타이머가 시작됩니다."}</span></div>
      <div className="flex flex-col gap-4 max-w-3xl mx-auto">
        <Card>
          <p className="text-sm text-muted mb-2">{isLR ? LR.scenario : INTERVIEW.scenario}</p>
          {isLR ? (
            <div className="flex items-center gap-4 flex-wrap">
              <div className="flex items-end gap-1 h-10" aria-hidden="true">{Array.from({ length: 20 }).map((_, k) => <div key={k} className="wavebar" style={{ animationDelay: `${(k % 9) * 0.09}s`, animationPlayState: phase === "listen" ? "running" : "paused", height: phase === "listen" ? undefined : "12%", opacity: phase === "listen" ? 1 : 0.3 }} />)}</div>
              <span className="font-semibold">{phase === "listen" ? "🔊 Listen carefully…" : "🎙 Now repeat."}</span>
              {(scriptShown || !hasTTS) ? <p className="passage w-full bg-surface2 border border-line rounded p-3">{LR.lines[i]}</p>
                : <button className="underline text-sm text-muted ml-auto" onClick={() => setScriptShown(true)}>소리가 안 나요 → 스크립트 보기</button>}
            </div>
          ) : (
            <div><div className="font-semibold mb-1">Interviewer</div><p className="passage">{INTERVIEW.qs[qi]}</p></div>
          )}
        </Card>
        {phase === "respond"
          ? <ResponsePanel key={i} onTick={setTl} seconds={isLR ? LR_SECONDS : INTERVIEW_SECONDS} onFinish={next}
              label={isLR ? "들은 문장을 입력하세요(마이크 사용 불가 시 텍스트로 응답)" : "45초 동안 답변을 입력하세요. 마이크가 없을 때는 말할 내용을 그대로 타이핑합니다."}
              placeholder={isLR ? "Type exactly what you heard…" : "Answer the interviewer's question…"} />
          : phase === "ready"
            ? <Card><div className="text-center py-4"><p className="text-muted mb-3">질문을 다 읽었으면 시작하세요. 버튼을 누르는 순간 45초 타이머가 시작됩니다.</p><button className="btn" onClick={() => setPhase("respond")}>답변 시작 (타이머 시작)</button></div></Card>
            : <Card><p className="text-muted text-center py-6">{isLR ? "문장을 듣는 중입니다." : "🔊 질문을 듣는 중입니다. 질문이 끝나면 45초 타이머가 시작됩니다."}</p></Card>}
      </div>
    </Shell>
  );
}

function MicTest() {
  const mic = useContext(MicContext);
  const { requestMic } = mic;
  const [phase, setPhase] = useState("idle");
  const [count, setCount] = useState(0);
  const [note, setNote] = useState("");
  const [asr, setAsr] = useState(!SR_OFF.v);
  const recordAndPlay = async () => {
    setNote("");
    const stream = mic.stream || (await requestMic());
    if (!stream) return;
    try {
      const rec = new MediaRecorder(stream); const chunks = [];
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      const stopped = new Promise((r) => { rec.onstop = r; });
      rec.start(); setPhase("recording");
      for (let n = 4; n > 0; n--) { setCount(n); await new Promise((r) => setTimeout(r, 1000)); }
      rec.stop(); await stopped;
      setPhase("playing");
      const buf = await new Blob(chunks, { type: rec.mimeType || "audio/webm" }).arrayBuffer();
      const AC = window.AudioContext || window.webkitAudioContext; const ac = new AC();
      const audio = await ac.decodeAudioData(buf);
      const src = ac.createBufferSource(); src.buffer = audio; src.connect(ac.destination);
      src.onended = () => { setPhase("idle"); try { ac.close(); } catch (e) {} };
      src.start();
    } catch (e) { setPhase("idle"); setNote("내 목소리 재생에 실패했습니다. 레벨 미터가 움직이면 녹음 자체는 정상입니다."); }
  };
  const toggleAsr = (v) => { SR_OFF.v = !v; setAsr(v); };
  return (
    <div className="flex flex-col gap-3 w-full">
      <div className="flex items-center gap-3 flex-wrap">
        <button className="btn btn-ghost" disabled={phase !== "idle"} onClick={recordAndPlay}>🎙 4초 녹음 후 내 목소리 듣기</button>
        {hasTTS && <button className="btn btn-ghost" onClick={() => speak("Sound check. You should hear this sentence clearly.")}>🔊 스피커 테스트</button>}
        <LevelMeter stream={mic.stream} active={mic.status === "ready"} />
      </div>
      <p className="text-sm" style={{ color: phase === "recording" ? "var(--bad)" : mic.status === "ready" ? "var(--good)" : mic.status === "denied" ? "var(--warn)" : "var(--muted)" }}>
        {phase === "recording" ? `● 녹음 중… ${count}초 (아무 문장이나 말해 보세요)` : phase === "playing" ? "▶ 내 목소리를 재생 중입니다" :
          mic.status === "ready" ? "마이크 연결됨" + (mic.perm === "granted" ? " (항상 허용 상태)" : "") + " · 버튼을 눌러 내 목소리를 확인하세요" : mic.status === "denied" ? "마이크를 사용할 수 없어 텍스트 응답 모드로 진행합니다 (주소창 자물쇠 → 마이크 → 허용 후 새로고침하면 다시 사용할 수 있어요)" : "아직 확인하지 않음 · 버튼을 누르면 마이크 허용을 요청합니다 (건너뛰면 텍스트 응답 모드)"}
      </p>
      {note && <p className="text-sm text-warn">{note}</p>}
      <p className="text-xs text-muted">스피커로 들으면 울림이 생길 수 있으니 헤드폰 사용을 권장합니다.</p>
      {SR && <label className="text-sm flex items-center gap-2"><input type="checkbox" checked={asr} onChange={(e) => toggleAsr(e.target.checked)} /> 자동 전사 사용 (말한 내용을 영어 텍스트로 변환해 채점)</label>}
    </div>
  );
}

/* ============ REPORT (선생님 전용) ============ */
function buildReport({ reading, listening, writing, speaking }) {
  const sk = { reading: !!reading.skipped, listening: !!listening.skipped, writing: !!writing.skipped, speaking: !!speaking.skipped };
  const spk = sk.speaking ? { lr: [], iv: [] } : speaking, wr = sk.writing ? { email: "", disc: "" } : writing;
  const lr = LR.lines.map((t, i) => ({ target: t, ...scoreRepeat(t, spk.lr[i] || { text: "", voicedMs: 0 }), resp: spk.lr[i] }));
  const iv = INTERVIEW.qs.map((q, i) => ({ q, ...scoreInterview(spk.iv[i] || { text: "", usedMic: false }, i), resp: spk.iv[i] }));
  const lrAvg = lr.reduce((a, x) => a + x.score, 0) / lr.length, ivAvg = iv.reduce((a, x) => a + x.score, 0) / iv.length;
  const spk5 = lrAvg * 0.5 + ivAvg * 0.5;
  const spk30 = Math.round(interp(SPK_MAP, spk5));
  const em = scoreEmail(wr.email), ds = scoreDiscussion(wr.disc);
  const wr5 = (em.score + ds.score) / 2, wr30 = Math.round(interp(WRT_MAP, wr5));
  const rd30 = Math.round(reading.ratio * 30), ls30 = Math.round(listening.ratio * 30);
  const secs = {
    reading: { s30: rd30, band: bandFrom("reading", rd30), spread: 1 },
    listening: { s30: ls30, band: bandFrom("listening", ls30), spread: 1 },
    writing: { s30: wr30, band: bandFrom("writing", wr30), spread: 0.5 },
    speaking: { s30: spk30, band: bandFrom("speaking", spk30), spread: 0.5 }
  };
  Object.keys(sk).forEach((k) => { if (sk[k]) secs[k] = { skipped: true, s30: 0, band: null, spread: 0 }; });
  const att = Object.values(secs).filter((s) => !s.skipped);
  const overall = att.length ? roundHalf(att.reduce((a, s) => a + s.band, 0) / att.length) : null;
  const flags = [...(sk.speaking ? [] : [...lr.flatMap((x) => x.flags), ...iv.flatMap((x) => x.flags)]), ...(sk.writing ? [] : [...em.flags, ...ds.flags])];
  const slim = (m) => ({ ...m, items: m.items.map(({ opts, ...rest }) => rest) });
  return { lr, iv, lrAvg, ivAvg, em, ds, secs, overall, flags, sk, texts: { email: wr.email, disc: wr.disc }, reading: slim(reading), listening: slim(listening) };
}

function levelAdvice(b) {
  if (b == null) return "응시한 영역이 없어 레벨을 산출하지 못했습니다.";
  if (b >= 5) return "상위권(C1 이상)입니다. 고득점을 위해 Interview의 elaboration 밀도와 Discussion의 반론·재반박 구조를 다듬는 단계입니다.";
  if (b >= 4) return "중상위권(B2)입니다. 연결어·구문 다양성과 Listen and Repeat 후반부 문장 정확도를 올리면 5점대에 진입할 수 있습니다.";
  if (b >= 3) return "중급(B1)입니다. 문장 단위 정확성(시제·수일치)과 이유-예시 구조 훈련이 가장 효율적입니다. 템플릿 기반 Speaking/Writing 집중 훈련을 권합니다.";
  return "기초 보강 단계입니다. 핵심 문형과 어휘 기반을 다진 뒤 Listen and Repeat, Build a Sentence부터 단계적으로 올리는 것을 권합니다.";
}

const Bar = ({ band, spread, label, s30, skipped }) => {
  if (skipped) return <div className="py-2 flex justify-between text-sm"><span className="font-semibold">{label}</span><span className="text-muted">미응시 (중도 종료)</span></div>;
  const lo = clampBand(band - spread), hi = clampBand(band + spread);
  const x = (v) => ((v - 1) / 5) * 100;
  return (
    <div className="py-2">
      <div className="flex justify-between text-sm mb-1"><span className="font-semibold">{label}</span><span className="mono">Band {band.toFixed(1)} <span className="text-muted">(예상 {lo.toFixed(1)}–{hi.toFixed(1)} · {cefr(band)} · {s30}/30)</span></span></div>
      <div className="relative h-3 rounded bg-surface2 border border-line">
        <div className="absolute top-0 bottom-0 rounded" style={{ left: x(lo) + "%", width: Math.max(2, x(hi) - x(lo)) + "%", background: "var(--accent)", opacity: 0.35 }} />
        <div className="absolute -top-1 -bottom-1 w-1 rounded" style={{ left: `calc(${x(band)}% - 2px)`, background: "var(--accent)" }} />
      </div>
      <div className="flex justify-between text-[10px] text-muted mono mt-0.5">{[1, 2, 3, 4, 5, 6].map((n) => <span key={n}>{n}</span>)}</div>
    </div>
  );
};

function reportText(R, name, meta) {
  const L = [];
  const sets = meta.sets || {};
  L.push(`[데이빗토플 Quick Diagnostic] ${name || "응시자"}`);
  L.push(`응시: ${fmtAt(meta.at)} · 소요 ${fmtDur(meta.durationSec)} · ${meta.endedEarly ? "중도 종료(" + (STAGE_KOR[meta.endedEarly] || meta.endedEarly) + " 진행 중)" : "전 영역 완료"} · ${meta.usedMic ? "마이크" : "텍스트 응답"}`);
  L.push(`세트: ${["reading", "listening", "speaking", "writing"].map((k) => sets[k]).filter(Boolean).join(" / ")}`);
  L.push("");
  L.push(R.overall == null ? "Overall: 산출 불가 (응시 영역 없음)" : `Overall ${R.overall.toFixed(1)} (${cefr(R.overall)}) · 구 120점 환산 약 ${OVERALL120[R.overall]}점`);
  ["reading", "listening", "writing", "speaking"].forEach((k) => { const s = R.secs[k]; L.push(`- ${KOR[k]}: ${s.skipped ? "미응시" : `Band ${s.band.toFixed(1)} (${cefr(s.band)}, ${s.s30}/30)`}`); });
  L.push("");
  const m = {}; R.flags.forEach((f) => { m[f.cat] = m[f.cat] || { ...f, n: 0 }; m[f.cat].n++; });
  const top = Object.values(m).sort((a, b) => b.n - a.n).slice(0, 6);
  L.push("[핵심 감점 요소]"); top.length ? top.forEach((f) => L.push(`· ${f.cat}${f.n > 1 ? " ×" + f.n : ""} — ${f.msg}`)) : L.push("· 없음");
  if (!R.sk.speaking) {
    L.push(""); L.push(`[Speaking] L&R 평균 ${R.lrAvg.toFixed(1)}/5 · Interview 평균 ${R.ivAvg.toFixed(1)}/5`);
    R.lr.forEach((x, i) => L.push(`L&R ${i + 1} [${x.score}/5] 정답: ${x.target} | 응답: ${(x.resp && x.resp.text) || "(없음)"}`));
    R.iv.forEach((x, i) => L.push(`Q${i + 1} [${x.score}/5] (${x.n} words) ${(x.resp && x.resp.text) || "(없음)"}`));
  }
  if (!R.sk.writing) {
    L.push(""); L.push(`[Writing] Email ${R.em.score}/5 (${R.em.n} words) · Discussion ${R.ds.score}/5 (${R.ds.n} words)`);
    L.push("-- Email --"); L.push(R.texts.email || "(없음)"); L.push("-- Discussion --"); L.push(R.texts.disc || "(없음)");
  }
  L.push("");
  [["Reading", R.reading, R.sk.reading], ["Listening", R.listening, R.sk.listening]].forEach(([t, r, s]) => {
    L.push(`[${t}] ${s ? "미응시" : r.right + "/" + r.total}`);
    if (!s) L.push(r.items.map((x, i) => `${i + 1}${x.ok ? "O" : "X"}`).join(" "));
  });
  L.push(""); L.push("※ 아래 '결과 코드'를 선생님 전용 화면(주소 끝에 #teacher)에 붙여 넣으면 전체 리포트가 열립니다.");
  return L.join("\n");
}

async function packReport(payload) {
  const bytes = new TextEncoder().encode(JSON.stringify(payload));
  let out = bytes, tag = "DT1:";
  try {
    if (typeof CompressionStream !== "undefined") {
      const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
      out = new Uint8Array(await new Response(cs).arrayBuffer()); tag = "DT1z:";
    }
  } catch (e) { out = bytes; tag = "DT1:"; }
  let bin = ""; for (let i = 0; i < out.length; i += 0x8000) bin += String.fromCharCode.apply(null, out.subarray(i, i + 0x8000));
  return tag + btoa(bin);
}
async function unpackReport(code) {
  const m = String(code).trim().replace(/\s+/g, "").match(/^(DT1z?):([A-Za-z0-9+/=]+)/);
  if (!m) throw new Error("bad code");
  const bin = atob(m[2]); let out = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  if (m[1] === "DT1z") { const ds = new Blob([out]).stream().pipeThrough(new DecompressionStream("gzip")); out = new Uint8Array(await new Response(ds).arrayBuffer()); }
  return JSON.parse(new TextDecoder().decode(out));
}

async function sendToTeacher({ name, message, code }) {
  if (!WEB3FORMS_KEY) return { ok: false, reason: "전송 설정(Access Key)이 아직 입력되지 않았습니다." };
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 25000);
  try {
    const res = await fetch("https://api.web3forms.com/submit", {
      method: "POST", signal: ctl.signal, headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ access_key: WEB3FORMS_KEY, subject: `[데이빗토플 레벨테스트] ${name || "응시자"} 결과`, from_name: "데이빗토플 레벨테스트", name: name || "응시자", message, result_code: code })
    });
    const j = await res.json().catch(() => ({}));
    return { ok: !!(res.ok && j.success), reason: (j && j.message) || String(res.status) };
  } catch (e) { return { ok: false, reason: "네트워크 오류" }; }
  finally { clearTimeout(to); }
}

/* ============ SUBMIT (학생에게는 점수를 보여주지 않음) ============ */
function Submit({ data, name, getMeta }) {
  const [state, setState] = useState("sending");
  const [code, setCode] = useState(""); const [err, setErr] = useState(""); const [copied, setCopied] = useState(false);
  const pack = useRef(null);
  const run = useCallback(async () => {
    setState("sending"); setErr("");
    try {
      if (!pack.current) {
        const meta = getMeta(); const R = buildReport(data);
        const c = await packReport({ v: 1, name, meta, R });
        pack.current = { text: reportText(R, name, meta), code: c }; setCode(c);
      }
      const r = await sendToTeacher({ name, message: pack.current.text, code: pack.current.code });
      if (r.ok) setState("sent"); else { setErr(String(r.reason || "")); setState("failed"); }
    } catch (e) { setErr(String((e && e.message) || e)); setState("failed"); }
  }, []);
  useEffect(() => { run(); }, []);
  const copy = async () => { try { await navigator.clipboard.writeText(code); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) { setCopied("fail"); } };
  return (
    <div className="min-h-screen flex items-center justify-center px-4 py-10">
      <div className="w-full max-w-xl flex flex-col gap-5">
        <p className="text-sm font-semibold tracking-widest text-accent">데이빗토플 · Quick Diagnostic Test</p>
        {state === "sending" && <Card><h1 className="text-2xl font-bold mb-2">답안을 제출하고 있어요…</h1><p className="text-muted">잠시만 기다려 주세요. 창을 닫지 마세요.</p></Card>}
        {state === "sent" && (
          <>
            <Card>
              <h1 className="text-2xl font-bold mb-2" style={{ textWrap: "balance" }}>{name ? `${name}님, ` : ""}수고하셨습니다!</h1>
              <p className="text-[15px]">시험이 정상적으로 제출되었고, 결과는 <b>선생님께 전달</b>되었습니다. 응시 화면에서는 점수가 공개되지 않으며, 분석이 끝나면 선생님이 직접 안내해 드립니다.</p>
            </Card>
            <section className="rounded-lg p-6 flex flex-col gap-3 items-start" style={{ background: "var(--bar)", color: "var(--barInk)" }}>
              <h2 className="text-lg font-bold">1:1 맞춤 진단 · 시범강의 안내</h2>
              <p className="opacity-85 text-[14.5px]">데이빗토플 공식 링크에서 상담 신청과 학습 자료를 확인할 수 있습니다.</p>
              <a className="btn" href={LINKTREE_URL} target="_blank" rel="noopener noreferrer">데이빗토플 공식 링크 바로가기</a>
            </section>
          </>
        )}
        {state === "failed" && (
          <Card className="flex flex-col gap-3">
            <h1 className="text-xl font-bold">결과를 자동으로 보내지 못했어요</h1>
            <p className="text-sm">{err ? `사유: ${err}. ` : ""}인터넷 연결을 확인하고 다시 전송해 보세요. 계속 실패하면 아래 <b>결과 코드</b>를 복사해 선생님께 보내 주세요. (코드에는 점수가 직접 보이지 않습니다.)</p>
            <div className="flex gap-2 flex-wrap"><button className="btn" onClick={run}>다시 전송</button><button className="btn btn-ghost" onClick={copy}>{copied === true ? "복사됨" : copied === "fail" ? "아래 코드를 직접 선택해 복사하세요" : "결과 코드 복사"}</button></div>
            <textarea readOnly className="w-full p-2 mono text-[11px]" style={{ height: 96 }} value={code} onFocus={(e) => e.target.select()} />
            <a className="underline text-sm text-muted" href={LINKTREE_URL} target="_blank" rel="noopener noreferrer">데이빗토플 공식 링크 (연락 방법)</a>
          </Card>
        )}
      </div>
    </div>
  );
}

/* ============ TEACHER (주소 끝에 #teacher) ============ */
function Teacher() {
  const [txt, setTxt] = useState(""); const [res, setRes] = useState(null); const [err, setErr] = useState("");
  const open = async () => { try { setErr(""); setRes(await unpackReport(txt)); } catch (e) { setErr("코드를 해석하지 못했습니다. 이메일의 '결과 코드'를 DT1 로 시작하는 처음부터 끝까지 그대로 붙여 넣어 주세요."); } };
  if (res) return (
    <div>
      <div className="bg-bar text-barInk"><div className="max-w-4xl mx-auto px-4 py-2.5 flex items-center justify-between text-sm"><span className="font-bold">데이빗토플 · 선생님 전용 리포트</span><button className="underline" onClick={() => { setRes(null); setTxt(""); }}>다른 코드 열기</button></div></div>
      <Result R={res.R} name={res.name} meta={res.meta} />
    </div>
  );
  return (
    <div className="max-w-2xl mx-auto px-4 py-10 flex flex-col gap-4">
      <div><p className="text-sm font-semibold tracking-widest text-accent">데이빗토플 · 선생님 전용</p><h1 className="text-2xl font-bold">응시 결과 열기</h1><p className="text-muted mt-1">이메일로 받은 <b>결과 코드</b>(DT1… 로 시작)를 붙여 넣으면 영역별 점수와 학생 답안이 포함된 전체 리포트가 열립니다. 코드는 이 브라우저 안에서만 해석되며 어디에도 저장되지 않습니다.</p></div>
      <textarea className="w-full p-3 mono text-[12px]" style={{ minHeight: 180 }} value={txt} onChange={(e) => setTxt(e.target.value)} placeholder="DT1z:H4sIA..." />
      {err && <p className="text-sm text-bad">{err}</p>}
      <div><button className="btn" disabled={!txt.trim()} onClick={open}>리포트 열기</button></div>
    </div>
  );
}

/* ============ END MODAL ============ */
function EndModal({ onCancel, onConfirm }) {
  useEffect(() => { const k = (e) => { if (e.key === "Escape") onCancel(); }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);
  return (
    <div className="modal-back" onClick={onCancel}>
      <div className="modal" role="alertdialog" aria-modal="true" aria-labelledby="end-title" onClick={(e) => e.stopPropagation()}>
        <h2 id="end-title" className="text-lg font-bold mb-2">시험을 지금 종료할까요?</h2>
        <p className="text-sm text-muted mb-4">지금까지 작성한 답안만 제출되고, 아직 시작하지 않은 영역은 <b>미응시</b>로 처리됩니다. 종료하면 되돌릴 수 없어요.</p>
        <div className="flex gap-2 justify-end flex-wrap">
          <button className="btn btn-ghost" autoFocus onClick={onCancel}>계속 응시</button>
          <button className="btn" style={{ background: "var(--bad)", borderColor: "var(--bad)", color: "#fff" }} onClick={onConfirm}>종료하고 제출</button>
        </div>
      </div>
    </div>
  );
}

/* ============ APP ============ */
const ORDER = ["reading", "listening", "writing", "speaking"];
function skippedData(k) {
  if (k === "reading") return { ...compileMCQ(READING_UNITS, {}, "reading"), skipped: true };
  if (k === "listening") return { ...compileMCQ(LISTENING_UNITS, {}, "listening"), skipped: true };
  if (k === "writing") return { email: "", disc: "", skipped: true };
  return { lr: [], iv: [], skipped: true };
}
function isEmptyPartial(k, p) {
  if (!p) return true;
  if (k === "reading" || k === "listening") return !(p.items || []).some((x) => x.answered);
  if (k === "writing") return !((p.email || "").trim() || (p.disc || "").trim());
  return !((p.lr || []).concat(p.iv || [])).some((r) => r && (r.text || "").trim());
}

function App() {
  const [teacher, setTeacher] = useState(() => /teacher/i.test((location.hash || "") + (location.search || "")));
  useEffect(() => { const h = () => setTeacher(/teacher/i.test((location.hash || "") + (location.search || ""))); window.addEventListener("hashchange", h); return () => window.removeEventListener("hashchange", h); }, []);
  const [stage, setStage] = useState("intro");
  const stageRef = useRef("intro"); stageRef.current = stage;
  const [name, setName] = useState("");
  const [data, setData] = useState({});
  const [mic, setMic] = useState({ status: "unknown", stream: null });
  const [perm, setPerm] = useState("unknown");
  const [endOpen, setEndOpen] = useState(false);
  const micRef = useRef(null), endedRef = useRef(null), t0 = useRef(null), dataRef = useRef({});
  dataRef.current = data;
  useEffect(() => {
    let st = null, dead = false;
    try { if (navigator.permissions && navigator.permissions.query) navigator.permissions.query({ name: "microphone" }).then((p) => { if (dead) return; st = p; setPerm(p.state); p.onchange = () => setPerm(p.state); }).catch(() => {}); } catch (e) {}
    return () => { dead = true; if (st) st.onchange = null; };
  }, []);
  const requestMic = useCallback(async () => {
    if (micRef.current && micRef.current.getAudioTracks().some((t) => t.readyState === "live")) return micRef.current;
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("unsupported");
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      micRef.current = stream; setMic({ status: "ready", stream }); return stream;
    } catch (e) { setMic({ status: "denied", stream: null }); return null; }
  }, []);
  const stopMic = useCallback(() => { try { micRef.current && micRef.current.getTracks().forEach((t) => t.stop()); } catch (e) {} micRef.current = null; }, []);
  const openEnd = useCallback(() => setEndOpen(true), []);
  const ctx = useMemo(() => ({ ...mic, perm, requestMic, openEnd }), [mic, perm, requestMic, openEnd]);
  useEffect(() => { window.scrollTo(0, 0); }, [stage]);
  const goSubmit = (nd) => { stopSpeech(); srsStop(); stopMic(); setData(nd); setStage("submit"); };
  const set = (k, next) => (v) => { if (next === "submit") goSubmit({ ...dataRef.current, [k]: v }); else { setData((d) => ({ ...d, [k]: v })); setStage(next); } };
  const endTest = () => {
    setEndOpen(false);
    const cur = stageRef.current, ci = ORDER.indexOf(cur);
    if (ci < 0) return;
    let partial = null; try { partial = LIVE.get && LIVE.get(); } catch (e) {}
    const nd = { ...dataRef.current };
    ORDER.forEach((k, i) => { if (i === ci) nd[k] = isEmptyPartial(k, partial) ? skippedData(k) : partial; else if (i > ci) nd[k] = skippedData(k); });
    endedRef.current = cur; goSubmit(nd);
  };
  const getMeta = () => {
    const sp = dataRef.current.speaking || {};
    const rs = ((sp.lr || []).concat(sp.iv || []));
    return { at: new Date().toISOString(), sets: SEL, endedEarly: endedRef.current, durationSec: t0.current ? Math.round((Date.now() - t0.current) / 1000) : null, usedMic: rs.some((r) => r && r.usedMic), usedSR: rs.some((r) => r && r.usedSR) };
  };
  if (teacher) return <Teacher />;
  let view;
  if (stage === "intro") view = <Intro name={name} setName={setName} onStart={async () => { stopSpeech(); if (mic.status === "unknown") await requestMic(); t0.current = Date.now(); setStage("reading"); }} />;
  else if (stage === "reading") view = <Reading onDone={set("reading", "listening")} />;
  else if (stage === "listening") view = <Listening onDone={set("listening", "writing")} />;
  else if (stage === "writing") view = <Writing onDone={set("writing", "speaking")} />;
  else if (stage === "speaking") view = <Speaking onDone={set("speaking", "submit")} />;
  else view = <Submit data={data} name={name} getMeta={getMeta} />;
  return <MicContext.Provider value={ctx}>{view}{endOpen && <EndModal onCancel={() => setEndOpen(false)} onConfirm={endTest} />}</MicContext.Provider>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
